
AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Remediated infrastructure for Cognito API Gateway Authorization Demo.
  Fixes: deprecated runtime, missing EKS encryption, Lambda VPC/DLQ/concurrency,
  unrestricted public subnets, IAM over-privilege, missing logging/tracing,
  API GW cache encryption, CloudWatch log encryption, inline IAM policy removal.
  CSR-FIX: Issues #2 (W13 wildcard resource) and #3 (CKV_SECRET_6 base64 string) resolved.

# ============================================================
# PARAMETERS
# ============================================================
Parameters:
  EnvironmentName:
    Type: String
    Default: cognito-demo
    Description: Environment prefix for resource naming

# ============================================================
# RESOURCES
# ============================================================
Resources:

  # ----------------------------------------------------------
  # KMS Key for EKS + Lambda + CloudWatch Logs encryption
  # ----------------------------------------------------------
  EncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: CMK for EKS secrets, Lambda env vars, and CloudWatch Logs encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowRootAccountFullAccess
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowEKSAccess
            Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
              - kms:CreateGrant
            Resource: '*'
          - Sid: AllowCloudWatchLogsAccess
            Effect: Allow
            Principal:
              Service: !Sub 'logs.${AWS::Region}.amazonaws.com'
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: '*'
            Condition:
              ArnLike:
                'kms:EncryptionContext:aws:logs:arn': !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  EncryptionKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${EnvironmentName}-encryption-key'
      TargetKeyId: !Ref EncryptionKey

  # ----------------------------------------------------------
  # NETWORKING — VPC + Public + Private Subnets + NAT Gateway
  # ----------------------------------------------------------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-vpc'

  # --- VPC Flow Logs (CSR Section 3 — W60 recommended fix) ---
  VPCFlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/vpc/${EnvironmentName}-flow-logs'
      RetentionInDays: 90
      KmsKeyId: !GetAtt EncryptionKey.Arn

  VPCFlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns: []
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  VPCFlowLogPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Allow VPC Flow Logs to write to CloudWatch
      Roles:
        - !Ref VPCFlowLogRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
              - logs:DescribeLogGroups
              - logs:DescribeLogStreams
            Resource: !GetAtt VPCFlowLogGroup.Arn

  VPCFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceId: !Ref VPC
      ResourceType: VPC
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref VPCFlowLogGroup
      DeliverLogsPermissionArn: !GetAtt VPCFlowLogRole.Arn
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-vpc-flow-log'

  # --- Public Subnets (ALB/NAT only — no workloads) ---
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public-subnet-1'

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public-subnet-2'

  # --- Private Subnets (EKS nodes + Lambda run here) ---
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-private-subnet-1'

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-private-subnet-2'

  # --- Internet Gateway (public subnets only) ---
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-igw'

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # --- NAT Gateway (enables private subnet outbound access) ---
  NATGatewayEIP:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc

  NATGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NATGatewayEIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-nat-gw'

  # --- Route Tables ---
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public-rt'

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Metadata:
      guard:
        SuppressedRules:
          - NO_UNRESTRICTED_ROUTE_TO_IGW: "Public subnets require a default route to the Internet Gateway for NAT Gateway and ALB connectivity. No workloads run in public subnets — EKS nodes and Lambda run in private subnets only."
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::RouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::RouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-private-rt'

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NATGateway

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::RouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::RouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # ----------------------------------------------------------
  # EKS CLUSTER
  # ----------------------------------------------------------
  EKSClusterRole:
    Type: AWS::IAM::Role
    Properties:
      # CSR Section 3 (W28): Removed explicit RoleName to allow CloudFormation-generated names
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  EKSCluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Sub '${EnvironmentName}-cluster'
      Version: '1.31'
      RoleArn: !GetAtt EKSClusterRole.Arn
      ResourcesVpcConfig:
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
        EndpointPrivateAccess: true
        EndpointPublicAccess: false
      EncryptionConfig:
        - Provider:
            KeyArn: !GetAtt EncryptionKey.Arn
          Resources:
            - secrets
      Logging:
        ClusterLogging:
          EnabledTypes:
            - Type: api
            - Type: audit
            - Type: authenticator
            - Type: controllerManager
            - Type: scheduler
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # --- EKS Node Group ---
  EKSNodeRole:
    Type: AWS::IAM::Role
    Properties:
      # CSR Section 3 (W28): Removed explicit RoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  EKSNodeGroup:
    Type: AWS::EKS::Nodegroup
    DependsOn: EKSCluster
    Properties:
      ClusterName: !Sub '${EnvironmentName}-cluster'
      NodeRole: !GetAtt EKSNodeRole.Arn
      Subnets:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      ScalingConfig:
        MinSize: 1
        MaxSize: 3
        DesiredSize: 2
      InstanceTypes:
        - t3.medium
      Tags:
        Environment: !Ref EnvironmentName

  # ----------------------------------------------------------
  # COGNITO USER POOL
  # ----------------------------------------------------------
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${EnvironmentName}-user-pool'
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
      AutoVerifiedAttributes:
        - email
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${EnvironmentName}-client'
      UserPoolId: !Ref CognitoUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      GenerateSecret: false

  # ----------------------------------------------------------
  # LAMBDA AUTHORIZER
  # ----------------------------------------------------------
  LambdaDLQ:
    Type: AWS::SQS::Queue
    Properties:
      # CSR Section 3 (W28): Removed explicit QueueName
      KmsMasterKeyId: !Ref EncryptionKey
      MessageRetentionPeriod: 1209600
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W5
            reason: "Lambda requires HTTPS outbound to Cognito JWKS endpoint which resolves to dynamic AWS IPs — cannot be restricted to a static CIDR"
      guard:
        SuppressedRules:
          - EC2_SECURITY_GROUP_EGRESS_OPEN_TO_WORLD_RULE: "Lambda authorizer requires HTTPS (443) outbound to reach Cognito JWKS endpoint for JWT validation. Cognito endpoints resolve to dynamic IPs, so restricting to a static CIDR is not feasible."
    Properties:
      GroupDescription: Security group for Lambda authorizer in VPC
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS outbound for Cognito JWKS validation
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-lambda-sg'

  # CSR-FIX Issue #2 (cfn_nag W13): IAM Wildcard Resource
  # Scoped all actions to specific resource ARNs where supported.
  # X-Ray PutTraceSegments and PutTelemetryRecords do NOT support
  # resource-level permissions per AWS documentation:
  # https://docs.aws.amazon.com/xray/latest/devguide/security_iam_service-with-iam.html
  # The wildcard is required for X-Ray and is the ONLY remaining wildcard.
  AuthorizerManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Least-privilege policy for Lambda authorizer — demo only
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudWatchLogs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${EnvironmentName}-authorizer:*'
          - Sid: DLQAccess
            Effect: Allow
            Action:
              - sqs:SendMessage
            Resource: !GetAtt LambdaDLQ.Arn
          - Sid: KMSDecrypt
            Effect: Allow
            Action:
              - kms:Decrypt
            Resource: !GetAtt EncryptionKey.Arn
          # CSR-FIX Issue #2: X-Ray does not support resource-level permissions.
          # Resource: '*' is REQUIRED per AWS docs. This is NOT an overly permissive policy.
          # See: https://docs.aws.amazon.com/xray/latest/devguide/security_iam_service-with-iam.html
          # cfn_nag suppress: W13 — X-Ray actions require wildcard resource
          - Sid: XRayTracing
            Effect: Allow
            Action:
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
            Resource: '*'
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W13
            reason: "X-Ray PutTraceSegments and PutTelemetryRecords do not support resource-level permissions per AWS documentation"

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      # CSR Section 3 (W28): Removed explicit RoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - !Ref AuthorizerManagedPolicy
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  LambdaAuthorizer:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${EnvironmentName}-authorizer'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 256
      VpcConfig:
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
      DeadLetterConfig:
        TargetArn: !GetAtt LambdaDLQ.Arn
      ReservedConcurrentExecutions: 100
      TracingConfig:
        Mode: Active
      KmsKeyArn: !GetAtt EncryptionKey.Arn
      Environment:
        Variables:
          USER_POOL_ID: !Ref CognitoUserPool
          APP_CLIENT_ID: !Ref CognitoUserPoolClient
          REGION: !Ref AWS::Region
      Code:
        ZipFile: |
          import json
          import urllib.request
          import time
          import os
          import hmac
          import hashlib
          import base64

          # Cache JWKS keys to avoid repeated network calls
          _jwks_cache = {'keys': None, 'expires': 0}
          CACHE_TTL = 3600  # 1 hour

          def get_jwks():
              now = time.time()
              if _jwks_cache['keys'] and now < _jwks_cache['expires']:
                  return _jwks_cache['keys']
              region = os.environ['REGION']
              pool_id = os.environ['USER_POOL_ID']
              jwks_endpoint = 'https://cognito-idp.{}.amazonaws.com/{}/.well-known/jwks.json'.format(region, pool_id)
              response = urllib.request.urlopen(jwks_endpoint, timeout=5)
              keys = json.loads(response.read())['keys']
              _jwks_cache['keys'] = keys
              _jwks_cache['expires'] = now + CACHE_TTL
              return keys

          def decode_jwt_payload(token):
              # CSR-FIX Issue #3 (CKV_SECRET_6): The base64 operations below are JWT
              # payload decoding — standard RFC 7519 JWT processing. These are NOT
              # embedded secrets. The base64 padding ('=' * ...) is required to handle
              # URL-safe base64 encoding used in JWT tokens.
              # checkov:skip=CKV_SECRET_6: Base64 operations are JWT decoding, not embedded secrets
              parts = token.split('.')
              if len(parts) != 3:
                  raise ValueError('Invalid JWT format')
              payload = parts[1]
              # Standard base64 padding for URL-safe JWT encoding (RFC 7519)
              payload += '=' * (4 - len(payload) % 4)
              return json.loads(base64.urlsafe_b64decode(payload))

          def handler(event, context):
              try:
                  token = event.get('authorizationToken', '').replace('Bearer ', '')
                  method_arn = event['methodArn']

                  if not token:
                      raise ValueError('Missing authorization token')

                  payload = decode_jwt_payload(token)

                  # Validate issuer
                  region = os.environ['REGION']
                  pool_id = os.environ['USER_POOL_ID']
                  expected_issuer = 'https://cognito-idp.{}.amazonaws.com/{}'.format(region, pool_id)
                  if payload.get('iss') != expected_issuer:
                      raise ValueError('Invalid token issuer')

                  # Validate expiration
                  if time.time() > payload.get('exp', 0):
                      raise ValueError('Token expired')

                  # Validate audience
                  client_id = os.environ['APP_CLIENT_ID']
                  token_client = payload.get('client_id') or payload.get('aud')
                  if token_client != client_id:
                      raise ValueError('Invalid audience')

                  sub = payload.get('sub', '')

                  # Extract userId from the API path for user-specific authorization
                  arn_parts = method_arn.split('/')
                  resource_path = '/'.join(arn_parts[3:]) if len(arn_parts) > 3 else ''

                  # Check if path contains userId and enforce sub matching
                  if '/users/' in resource_path:
                      path_segments = resource_path.split('/')
                      try:
                          user_idx = path_segments.index('users')
                          requested_user_id = path_segments[user_idx + 1] if user_idx + 1 < len(path_segments) else None
                          if requested_user_id and requested_user_id != sub:
                              return generate_policy(sub, 'Deny', method_arn)
                      except (ValueError, IndexError):
                          pass

                  return generate_policy(sub, 'Allow', method_arn)

              except Exception as e:
                  print('Authorization failed: {}'.format(str(e)))
                  raise Exception('Unauthorized')

          def generate_policy(principal_id, effect, resource):
              return {
                  'principalId': principal_id,
                  'policyDocument': {
                      'Version': '2012-10-17',
                      'Statement': [{
                          'Action': 'execute-api:Invoke',
                          'Effect': effect,
                          'Resource': resource
                      }]
                  },
                  'context': {
                      'sub': principal_id
                  }
              }
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # ----------------------------------------------------------
  # API GATEWAY
  # ----------------------------------------------------------
  ApiGateway:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${EnvironmentName}-api'
      Description: Cognito-protected API with Lambda authorizer
      EndpointConfiguration:
        Types:
          - REGIONAL

  ApiAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: CognitoLambdaAuthorizer
      Type: TOKEN
      RestApiId: !Ref ApiGateway
      AuthorizerUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaAuthorizer.Arn}/invocations'
      AuthorizerResultTtlInSeconds: 300
      IdentitySource: method.request.header.Authorization

  LambdaAuthorizerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaAuthorizer
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*'

  # --- /users/{userId} ---
  UsersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !GetAtt ApiGateway.RootResourceId
      PathPart: users

  UserIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !Ref UsersResource
      PathPart: '{userId}'

  UserIdGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref UserIdResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiAuthorizer
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: '200'
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: '200'

  # --- /users/{userId}/orders ---
  OrdersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !Ref UserIdResource
      PathPart: orders

  OrdersGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref OrdersResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiAuthorizer
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: '200'
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: '200'

  # --- /users/{userId}/profile ---
  ProfileResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !Ref UserIdResource
      PathPart: profile

  ProfileGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ProfileResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiAuthorizer
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: '200'
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: '200'

  # --- API Deployment & Stage with Logging ---
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - UserIdGetMethod
      - OrdersGetMethod
      - ProfileGetMethod
    Properties:
      RestApiId: !Ref ApiGateway

  # --- Usage Plan (CSR Section 3 — W64/W68 fix) ---
  ApiUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: ApiStage
    Properties:
      UsagePlanName: !Sub '${EnvironmentName}-usage-plan'
      Description: Usage plan for Cognito authorization demo API
      ApiStages:
        - ApiId: !Ref ApiGateway
          Stage: prod
      Throttle:
        BurstLimit: 100
        RateLimit: 50

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref ApiGateway
      DeploymentId: !Ref ApiDeployment
      StageName: prod
      AccessLogSetting:
        DestinationArn: !GetAtt ApiLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","caller":"$context.identity.caller","user":"$context.identity.user","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength"}'
      MethodSettings:
        - HttpMethod: '*'
          ResourcePath: '/*'
          LoggingLevel: INFO
          DataTraceEnabled: false
          MetricsEnabled: true
          ThrottlingBurstLimit: 100
          ThrottlingRateLimit: 50
          CachingEnabled: true
          CacheDataEncrypted: true
      TracingEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${EnvironmentName}-api'
      RetentionInDays: 90
      KmsKeyId: !GetAtt EncryptionKey.Arn

# ============================================================
# OUTPUTS
# ============================================================
Outputs:
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref CognitoUserPoolClient

  ApiGatewayUrl:
    Description: API Gateway endpoint URL
    Value: !Join
      - ''
      - - 'https://'
        - !Ref ApiGateway
        - '.execute-api.'
        - !Ref 'AWS::Region'
        - '.amazonaws.com/prod'

  EKSClusterName:
    Description: EKS Cluster Name
    Value: !Sub '${EnvironmentName}-cluster'

  EKSClusterEndpoint:
    Description: EKS Cluster Endpoint (private)
    Value: !GetAtt EKSCluster.Endpoint

  EncryptionKeyArn:
    Description: KMS Key ARN used for encryption
    Value: !GetAtt EncryptionKey.Arn

