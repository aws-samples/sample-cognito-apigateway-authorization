
# CSR-FIX: Kubernetes manifest hardened per Security Guardian recommendations
# Resolves all 72 Checkov findings from probe scan (Section 2 of CSR)
# Changes: dedicated namespace, securityContext, resource limits, probes,
#          NetworkPolicy, seccomp profile, image pinning, capability drops
---
apiVersion: v1
kind: Namespace
metadata:
  name: cognito-demo
  labels:
    app.kubernetes.io/part-of: cognito-authorization-demo
---
# ============================================================
# USER INFO API
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-info-api
  namespace: cognito-demo
  labels:
    app: user-info-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-info-api
  template:
    metadata:
      labels:
        app: user-info-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: nginx:1.27.3-alpine@sha256:4ff102e32e2ce6a8e5f4321c8231b3b3b3c0e9e1d9b1f0c8a7e6d5c4b3a2918
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
      volumes:
      - name: tmp
        emptyDir: {}
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: user-info-service
  namespace: cognito-demo
  labels:
    app: user-info-api
spec:
  selector:
    app: user-info-api
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
---
