apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-info-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-info-api
  template:
    metadata:
      labels:
        app: user-info-api
    spec:
      containers:
      - name: api
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: user-info-service
spec:
  selector:
    app: user-info-api
  ports:
  - port: 80
---
